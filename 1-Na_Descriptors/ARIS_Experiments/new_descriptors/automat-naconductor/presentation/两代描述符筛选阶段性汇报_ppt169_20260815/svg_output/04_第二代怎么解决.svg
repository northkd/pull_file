    <text x="376" y="284" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">先扣掉每一类体系的平均水平，</text>
    <text x="376" y="308" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">只比同类材料内部谁高谁低</text>
