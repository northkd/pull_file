  <g id="bottom-note" data-pptx-bounds="48 612 1184 32">
    <text x="48" y="634" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">四层方案：Zeo++（几何）→ BVSE 键价能垒 → DFT 密度泛函 → AIMD 分子动力学，越往后越准越贵，低成本筛候选、高成本做验证。</text>
