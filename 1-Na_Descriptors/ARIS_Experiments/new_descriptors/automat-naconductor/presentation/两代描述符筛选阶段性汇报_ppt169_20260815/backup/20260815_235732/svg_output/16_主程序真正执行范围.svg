    <text x="274" y="552" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">validate_raw.py</text>
    <text x="274" y="580" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">registry integrity gate</text>
