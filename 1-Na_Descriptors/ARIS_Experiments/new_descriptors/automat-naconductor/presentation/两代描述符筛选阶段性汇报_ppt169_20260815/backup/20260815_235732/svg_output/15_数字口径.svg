    <text x="702" y="430" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#182229">− bottleneck_anisotropy：永久不可用</text>
    <text x="702" y="462" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#182229">− bvse_barrier_estimate：缺后端</text>
