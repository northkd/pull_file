    <text x="123" y="229" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">环节</text>
    <text x="328" y="229" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">第一代</text>
    <text x="663" y="229" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">第二代</text>
    <text x="1050" y="229" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">当前边界</text>

    <text x="64" y="276" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">数据入口</text>
    <text x="214" y="276" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">一材料一行；口径较粗</text>
    <text x="474" y="268" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">材料表/测量表分开；<tspan x="474" dy="20">室温值选择</tspan></text>
    <text x="884" y="268" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#C75B39">来源与体系标签<tspan x="884" dy="20">仍需人工核实</tspan></text>

    <text x="64" y="326" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">第一轮比较</text>
    <text x="214" y="326" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">全样本直接排序</text>
    <text x="474" y="318" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">扣除体系差异；<tspan x="474" dy="20">再看体系内排序</tspan></text>
    <text x="884" y="318" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#C75B39">致密度与测试方法<tspan x="884" dy="20">未控制</tspan></text>

    <text x="64" y="376" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">描述符身份</text>
    <text x="214" y="376" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">计算后直接使用</text>
    <text x="474" y="368" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">登记公式、单位、来源<tspan x="474" dy="20">与写法敏感性</tspan></text>
    <text x="884" y="376" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#C75B39">205处身份字段待完成</text>

    <text x="64" y="426" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">稳定性</text>
    <text x="214" y="426" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">200次重采样看排名</text>
    <text x="474" y="418" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">反复半样本；<tspan x="474" dy="20">每次重做稀疏选择</tspan></text>
    <text x="884" y="426" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#C75B39">仍属探索性选择</text>

    <text x="64" y="476" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">冗余</text>
    <text x="214" y="476" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">没有系统去重</text>
    <text x="474" y="468" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">别名、共同来源、<tspan x="474" dy="20">物理类别分层</tspan></text>
    <text x="884" y="476" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#C75B39">相关簇未自动实现</text>

    <text x="64" y="526" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">组合</text>
    <text x="214" y="526" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">大量手写公式后排名</text>
    <text x="474" y="518" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">限制类别、算符<tspan x="474" dy="20">与量纲</tspan></text>
    <text x="884" y="518" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#C75B39">选择后不确定性<tspan x="884" dy="20">仍需加强</tspan></text>

    <text x="64" y="576" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">跨体系</text>
    <text x="214" y="576" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">少量候选做过留出</text>
    <text x="474" y="576" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">当前没有真正 LOSO</text>
    <text x="884" y="576" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#C75B39">不能宣称外推</text>
