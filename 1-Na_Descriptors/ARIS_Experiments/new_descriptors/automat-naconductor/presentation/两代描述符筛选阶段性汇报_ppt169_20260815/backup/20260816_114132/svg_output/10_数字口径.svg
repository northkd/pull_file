  <g id="not-second-generation-result" data-pptx-bounds="254 544 772 78">
    <rect x="254" y="544" width="772" height="78" fill="#C75B39"/>
    <text x="640" y="576" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#FBE5DF">一个回答“旧模型表现怎样”，一个回答“代码入口多少”</text>
    <text x="640" y="608" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">都不回答“第二轮发现了什么”</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 650 1184 38">
    <text x="48" y="681" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">Q&amp;A附录｜数字必须和对象、阶段一起陈述</text>
    <text id="page-number" data-pptx-role="page-number" x="1232" y="681" text-anchor="end" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">10 / 13</text>
