<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header" data-pptx-bounds="48 30 1184 106">
    <text x="48" y="50" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#C75B39">Q3｜数字口径</text>
    <text x="48" y="104" font-family="Georgia, 'Songti SC', serif" font-size="42" font-weight="bold" fill="#113B4A">0.793 和 41→38 分别代表什么？</text>
    <line x1="48" y1="126" x2="1232" y2="126" stroke="#CFDAD7" stroke-width="1"/>
  </g>
  <g id="historical-model-score" data-pptx-bounds="48 174 530 338">
    <text x="48" y="206" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#647176">第一代历史模型性能</text>
    <text x="48" y="300" font-family="Georgia, 'Songti SC', serif" font-size="78" font-weight="bold" fill="#113B4A">0.793</text>
    <text x="48" y="340" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="bold" fill="#182229">交叉验证 Spearman</text>
    <line x1="48" y1="362" x2="540" y2="362" stroke="#113B4A" stroke-width="3"/>
    <text x="48" y="398" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#182229">输入：A2 + NaNa + SoftBV / Zeo++</text>
    <text x="48" y="432" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#647176">仅 A2 + NaNa 网络量：0.755</text>
    <text x="48" y="474" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#C75B39">不是 A2×NaNa 单一描述符的相关性</text>
  </g>
  <g id="entry-status" data-pptx-bounds="702 174 530 338">
    <text x="702" y="206" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#647176">代码入口状态</text>
    <text x="702" y="300" font-family="Georgia, 'Songti SC', serif" font-size="78" font-weight="bold" fill="#2E7D6E">41 → 38</text>
    <text x="702" y="340" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="bold" fill="#182229">注册入口 → 可搜索入口</text>
    <line x1="702" y1="362" x2="1232" y2="362" stroke="#2E7D6E" stroke-width="3"/>
    <text x="702" y="398" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#182229">去掉一个兼容别名</text>
    <text x="702" y="430" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#182229">去掉两个当前不可用入口</text>
    <text x="702" y="462" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#182229">实际排序还会受有效覆盖率影响</text>
    <text x="702" y="496" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#C75B39">不是第二轮已经得到的结果数量</text>
