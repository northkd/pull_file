    <text x="72" y="358" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#C75B39">→ 新数据上取值高度相关（待做）</text>
    <text x="72" y="382" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">最后一步要等数据到位做相关簇分析</text>
