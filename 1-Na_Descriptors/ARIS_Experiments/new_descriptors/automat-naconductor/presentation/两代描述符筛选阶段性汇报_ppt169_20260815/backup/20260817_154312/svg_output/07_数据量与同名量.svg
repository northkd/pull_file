<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header" data-pptx-bounds="48 40 1184 116">
    <text x="48" y="64" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#C75B39">Q&amp;A 附录</text>
    <text x="48" y="124" font-family="Georgia, 'Songti SC', serif" font-size="42" font-weight="bold" fill="#113B4A">数据量对不上，同名量也不能跨代比</text>
    <line x1="48" y1="148" x2="1232" y2="148" stroke="#CFDAD7" stroke-width="1"/>
  </g>
  <g id="count-clarify" data-pptx-bounds="48 176 624 232">
    <text x="48" y="200" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#647176">先回答最容易被追问的：103 还是 84？</text>
    <rect x="48" y="216" width="296" height="88" fill="#EFF3F1" stroke="#CFDAD7" stroke-width="1"/>
    <text x="64" y="244" font-family="Georgia, 'Songti SC', serif" font-size="48" font-weight="bold" fill="#113B4A">103</text>
    <text x="64" y="270" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">第一轮正式记录</text>
    <text x="64" y="290" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">103 条记录 + 103 份 CIF</text>
    <rect x="360" y="216" width="296" height="88" fill="#FBE5DF" stroke="#C75B39" stroke-width="1"/>
    <text x="376" y="244" font-family="Georgia, 'Songti SC', serif" font-size="48" font-weight="bold" fill="#C75B39">84</text>
    <text x="376" y="270" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">第二代目录里的历史缓存</text>
    <text x="376" y="290" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">一份中间文件，不能替代正式记录</text>
    <text x="48" y="332" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">数据表文件名仍写 107，删 4 个含锂结构后实际 103 行，文件名没改。</text>
    <text x="48" y="358" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">两者来源不同，不能拿来互相替换。</text>
    <text x="48" y="392" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#647176">历史类别分布：NASICON 30、硫化物 41、卤化物 13、氢化物和硼氢化物 14、</text>
    <text x="48" y="412" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#647176">β-氧化铝 2、反钙钛矿 2、氧化物 1。第二代锁定前三类。</text>
  </g>
  <g id="name-clash-table" data-pptx-bounds="688 176 544 432">
    <text x="688" y="200" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#647176">同名量跨代不对应</text>
    <rect x="688" y="216" width="544" height="36" fill="#113B4A"/>
    <text x="704" y="240" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">同名量</text>
    <text x="816" y="240" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">第一代</text>
    <text x="1064" y="240" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">第二代</text>
    <line x1="808" y1="216" x2="808" y2="408" stroke="#CFDAD7" stroke-width="1"/>
    <line x1="1056" y1="216" x2="1056" y2="408" stroke="#CFDAD7" stroke-width="1"/>
    <rect x="688" y="252" width="544" height="78" fill="#FFFFFF"/>
    <text x="704" y="276" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">局域宽松因子</text>
    <text x="704" y="298" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#647176">代号 A2</text>
    <text x="816" y="276" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#182229">无量纲比值</text>
    <text x="816" y="296" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#647176">全结构最长 Na–阴离子键长</text>
    <text x="816" y="316" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#647176">÷ 有效半径之和</text>
    <text x="1064" y="276" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#182229">最长键长均值</text>
    <text x="1064" y="296" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#647176">每个 Na 位点最长键长的</text>
    <text x="1064" y="316" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#647176">平均，单位埃（Å）</text>
    <line x1="688" y1="330" x2="1232" y2="330" stroke="#CFDAD7" stroke-width="1"/>
    <rect x="688" y="330" width="544" height="78" fill="#F7F9F8"/>
    <text x="704" y="354" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">位点连通量</text>
    <text x="704" y="376" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#647176">代号 NaNa</text>
    <text x="816" y="354" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#182229">整批样本做百分位秩</text>
    <text x="816" y="378" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#647176">换一批材料、同结构的值都会变</text>
    <text x="1064" y="354" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#182229">单结构近似公式</text>
    <text x="1064" y="378" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#647176">不依赖整批样本</text>
    <rect x="688" y="408" width="544" height="64" fill="#FBE5DF"/>
    <text x="704" y="436" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#C75B39">结论</text>
    <text x="704" y="460" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#182229">公式、单位、聚合方式都不同，历史 0.597 不能算到第二代头上</text>
    <text x="688" y="500" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">第二代代码里“已知 0.597”的注释是错误沿用，要改。</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 650 1184 38">
    <text x="48" y="681" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">Q&amp;A 附录｜精确细节</text>
    <text id="page-number" data-pptx-role="page-number" x="1232" y="681" text-anchor="end" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">07 / 12</text>
  </g>
</svg>
