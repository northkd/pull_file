  </g>
  <g id="lead" data-pptx-bounds="48 176 1184 32">
    <text x="48" y="200" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#182229">两个描述符搭在一起看，第一代和第二代的搭法完全不同。</text>
  </g>
  <g id="comparison-table" data-pptx-bounds="48 224 1184 312">
    <rect x="48" y="224" width="1184" height="40" fill="#113B4A"/>
    <text x="80" y="250" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">对比维度</text>
    <text x="448" y="250" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">第一轮</text>
    <text x="864" y="250" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">第二代</text>
    <line x1="424" y1="224" x2="424" y2="536" stroke="#CFDAD7" stroke-width="1"/>
    <line x1="840" y1="224" x2="840" y2="536" stroke="#CFDAD7" stroke-width="1"/>
    <rect x="48" y="264" width="1184" height="68" fill="#FFFFFF"/>
    <text x="80" y="292" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="bold" fill="#113B4A">怎么搭</text>
    <text x="448" y="290" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">列出七千多个公式</text>
    <text x="448" y="314" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">加减乘除任意组合，按分数挑</text>
    <text x="864" y="290" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">先按材料意义分组挑代表</text>
    <text x="864" y="314" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">只允许有物理意义的组合</text>
    <line x1="48" y1="332" x2="1232" y2="332" stroke="#CFDAD7" stroke-width="1"/>
    <rect x="48" y="332" width="1184" height="68" fill="#F7F9F8"/>
    <text x="80" y="360" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="bold" fill="#113B4A">举个例子</text>
    <text x="448" y="358" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">“畸变 × 最长键长 ÷ 目标键长”</text>
    <text x="448" y="382" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#C75B39">能算，但材料上说不清为什么这么乘</text>
    <text x="864" y="358" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">局域配位配网络配骨架</text>
    <text x="864" y="382" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">每类挑一个，看加减乘除是否说得通</text>
    <line x1="48" y1="400" x2="1232" y2="400" stroke="#CFDAD7" stroke-width="1"/>
    <rect x="48" y="400" width="1184" height="68" fill="#FFFFFF"/>
