    <text x="72" y="584" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#C75B39">诚实说明</text>
    <text x="72" y="614" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#182229">统计上自动去重和嵌套外推验证还没做，“试多了撞巧合”的问题还没有完全解决。</text>
