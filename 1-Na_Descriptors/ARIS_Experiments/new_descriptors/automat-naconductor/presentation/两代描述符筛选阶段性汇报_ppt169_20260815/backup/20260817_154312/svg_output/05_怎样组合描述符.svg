    <text x="448" y="428" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">不管，只看分数</text>
    <text x="864" y="424" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#2E7D6E">长度加长度可以</text>
    <text x="864" y="450" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#C75B39">长度加无量纲数不行</text>
    <line x1="48" y1="468" x2="1232" y2="468" stroke="#CFDAD7" stroke-width="1"/>
    <rect x="48" y="468" width="1184" height="68" fill="#F7F9F8"/>
    <text x="80" y="496" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="bold" fill="#113B4A">结果</text>
    <text x="448" y="494" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">容易拼出“高分但材料上</text>
    <text x="448" y="518" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">解释不通”的公式</text>
    <text x="864" y="494" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">组合空间小很多</text>
    <text x="864" y="518" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#182229">每个组合都有材料解释</text>
