    <text x="680" y="266" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">尝试组合</text>
    <text x="650" y="326" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#182229">看两个因素一起时</text>
    <text x="650" y="354" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#182229">是否更有解释力</text>
    <text x="650" y="392" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">加、减、乘、除等形式</text>
    <line x1="650" y1="420" x2="790" y2="420" stroke="#CFDAD7" stroke-width="1"/>
    <text x="650" y="450" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#2E7D6E">回答：能否互补？</text>
  </g>
  <g id="step-4" data-pptx-bounds="832 236 176 238">
    <rect x="832" y="236" width="176" height="238" fill="#FFFFFF" stroke="#CFDAD7" stroke-width="1"/>
    <rect x="832" y="236" width="176" height="46" fill="#113B4A"/>
