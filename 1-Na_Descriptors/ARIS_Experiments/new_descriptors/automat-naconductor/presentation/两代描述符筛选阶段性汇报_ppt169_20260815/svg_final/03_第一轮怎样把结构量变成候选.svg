    <text x="880" y="266" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">反复换样本</text>
    <text x="850" y="326" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#182229">看结果是否偶然</text>
    <text x="850" y="362" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">重复抽取材料</text>
    <text x="850" y="390" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">重新观察排名</text>
    <line x1="850" y1="420" x2="990" y2="420" stroke="#CFDAD7" stroke-width="1"/>
    <text x="850" y="450" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">回答：稳不稳定？</text>
  </g>
  <g id="step-5" data-pptx-bounds="1032 236 200 238">
    <rect x="1032" y="236" width="200" height="238" fill="#FBE5DF" stroke="#C75B39" stroke-width="1"/>
    <rect x="1032" y="236" width="200" height="46" fill="#C75B39"/>
    <text x="1050" y="266" font-family="Georgia, 'Songti SC', serif" font-size="20" font-weight="bold" fill="#FFFFFF">五</text>
    <text x="1080" y="266" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">按类别留出</text>
    <text x="1050" y="326" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#182229">换一个体系</text>
    <text x="1050" y="354" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#182229">还能不能成立？</text>
    <text x="1050" y="392" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">留出一个材料类别</text>
    <line x1="1050" y1="420" x2="1214" y2="420" stroke="#E3B4A6" stroke-width="1"/>
    <text x="1050" y="450" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#C75B39">回答：能否迁移？</text>
