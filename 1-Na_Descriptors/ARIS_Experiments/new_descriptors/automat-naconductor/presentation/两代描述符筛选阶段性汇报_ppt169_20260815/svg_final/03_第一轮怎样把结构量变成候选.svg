    <line x1="204" y1="350" x2="232" y2="350" stroke="#2E7D6E" stroke-width="3"/>
    <line x1="408" y1="350" x2="432" y2="350" stroke="#2E7D6E" stroke-width="3"/>
    <line x1="608" y1="350" x2="632" y2="350" stroke="#2E7D6E" stroke-width="3"/>
    <line x1="808" y1="350" x2="832" y2="350" stroke="#2E7D6E" stroke-width="3"/>
    <line x1="1008" y1="350" x2="1032" y2="350" stroke="#C75B39" stroke-width="3"/>
  </g>
  <g id="process-takeaway" data-pptx-bounds="48 526 1184 92">
    <rect x="48" y="526" width="1184" height="92" fill="#EFF3F1"/>
    <text x="640" y="562" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#647176">第一轮把“找候选、做比较、看稳定、看迁移”串成了可以运行的探索流程</text>
    <text x="640" y="598" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="bold" fill="#113B4A">但这些环节使用的是同一批历史数据，仍需要第二轮重新检查</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 650 1184 38">
    <text x="48" y="681" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">正文｜每个环节回答一个不同的材料问题</text>
    <text id="page-number" data-pptx-role="page-number" x="1232" y="681" text-anchor="end" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#647176">03 / 13</text>
