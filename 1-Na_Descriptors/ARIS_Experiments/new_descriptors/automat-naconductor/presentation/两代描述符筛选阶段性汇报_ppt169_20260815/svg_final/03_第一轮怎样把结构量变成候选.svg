    <text x="474" y="266" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">先做单项比较</text>
    <text x="450" y="326" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#182229">看是否同向</text>
    <text x="450" y="362" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">相关性比较</text>
    <text x="450" y="390" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">简单预测复核</text>
    <line x1="450" y1="420" x2="590" y2="420" stroke="#CFDAD7" stroke-width="1"/>
    <text x="450" y="450" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#113B4A">回答：有没有关系？</text>
  </g>
  <g id="step-3" data-pptx-bounds="632 236 200 238">
    <rect x="632" y="236" width="176" height="238" fill="#EFF3F1" stroke="#CFDAD7" stroke-width="1"/>
