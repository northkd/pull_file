<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header" data-pptx-bounds="48 30 1184 106">
    <text x="48" y="50" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#2E7D6E">02｜第一轮方法</text>
    <text x="48" y="104" font-family="Georgia, 'Songti SC', serif" font-size="42" font-weight="bold" fill="#113B4A">第一轮怎样把结构量变成候选？</text>
    <line x1="48" y1="126" x2="1232" y2="126" stroke="#CFDAD7" stroke-width="1"/>
  </g>
  <g id="process-lead" data-pptx-bounds="48 148 1184 44">
    <text x="48" y="178" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" fill="#182229">第一轮不是一个单独算法，而是几个环节接力回答不同问题。</text>
  </g>
  <g id="input-block" data-pptx-bounds="48 236 156 238">
    <rect x="48" y="236" width="156" height="238" fill="#113B4A"/>
    <text x="126" y="280" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">输入</text>
    <text x="126" y="340" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="44" font-weight="bold" fill="#FFFFFF">CIF</text>
    <text x="126" y="378" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#D9E4E1">结构文件</text>
    <line x1="76" y1="402" x2="176" y2="402" stroke="#6EA89C" stroke-width="2"/>
    <text x="126" y="438" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#FFFFFF">电导率</text>
    <text x="126" y="462" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#D9E4E1">目标值</text>
  </g>
  <g id="step-1" data-pptx-bounds="232 236 176 238">
    <rect x="232" y="236" width="176" height="238" fill="#EFF3F1" stroke="#CFDAD7" stroke-width="1"/>
    <rect x="232" y="236" width="176" height="46" fill="#2E7D6E"/>
    <text x="250" y="266" font-family="Georgia, 'Songti SC', serif" font-size="20" font-weight="bold" fill="#FFFFFF">一</text>
    <text x="280" y="266" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">构造结构量</text>
    <text x="250" y="326" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="bold" fill="#182229">把结构变成数字</text>
    <text x="250" y="362" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">键长、畸变、</text>
    <text x="250" y="390" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#647176">Na 网络、浓度等</text>
    <line x1="250" y1="420" x2="390" y2="420" stroke="#CFDAD7" stroke-width="1"/>
    <text x="250" y="450" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#2E7D6E">回答：看哪些量？</text>
  </g>
  <g id="step-2" data-pptx-bounds="432 236 184 238">
    <rect x="432" y="236" width="176" height="238" fill="#FFFFFF" stroke="#CFDAD7" stroke-width="1"/>
    <rect x="432" y="236" width="176" height="46" fill="#113B4A"/>
