# Na离子导体描述符搜索配置
# 基于 automat 框架，针对 Na 离子固态电解质结构描述符与电导率关系研究

task:
  name: naconductor
  description: >
    搜索 Na 离子固态导体的局域结构描述符组合，
    使其与 log10(σ/S·cm⁻¹) 的线性残差秩相关性最大化。
    描述符从 CIF 结构文件计算，禁止使用 log/√/幂运算构造新特征。
    目标是找到物理可解释、统计稳健的描述符组合，
    而非单纯追求预测精度。

data:
  raw_file: data/naconductor_raw.csv
  featurized_file: data/naconductor_featurized.csv
  target_column: log_sigma
  structure_column: cif_path
  material_id_column: material_id
  formula_column: formula
  system_column: system
  anion_type_column: anion_type
  # 不做 train/val/test 预拆分——用 CV 策略替代
  # 原始数据 84 行，全量参与交叉验证

deconfound:
  # 混杂变量列表——这些变量与目标相关但不是因果通路
  # 在计算描述符-目标相关性时需要控制
  confounders:
    - system          # 主控制：体系类型（NASICON/sulfide/halide）
    - anion_type      # 增量控制；报告相对 system 的秩增量/冗余，不作独立因果解释
  categorical_coding: reference_class
  primary_control: system
  report_design_rank: true
  # 残差化方法：偏相关
  method: partial_correlation
  # 线性残差秩相关作为主要评价指标（非文献意义的偏 Spearman，详见 estimand 段）
  primary_metric: rank_corr_of_linear_residuals

stage1:
  # W3-3 冻结值：按 |rho| 取固定前 k 位，替代无外部依据的 0.2/0.3/0.7 阈值
  top_k: 10

estimand:
  # 主指标定义与诚实命名声明
  name: rank_corr_of_linear_residuals
  definition: >
    对 x 与 y 各自做正交投影残差化（等价于 OLS 残差，alpha=0），在原始尺度上取残差，
    再对两组残差求 Spearman rho。残差化控制矩阵的实际行为：
    (1) intercept 作为设计矩阵的显式列（全 1 向量）追加到控制矩阵后做 lstsq 拟合，
    使参考类（drop_first 编码的全零行）获得截距系数作为预测值；
    (2) system 以参考类编码（drop_first=True）全部进入控制集；
    (3) anion_type 仅在对 [intercept, system] 提供秩增量（matrix_rank 上升）
    时按列进入控制集，冗余对比项不进入；
    (4) 组合层使用两个不同的对照量：system_rho 用仅含 system 的控制矩阵，
    all_rho 用 system + anion 增量的完整控制矩阵，两者作为 supplementary_partial_association
    对照暴露给下游，不直接取差；
    (5) 单描述符层只使用 system + anion 增量的完整控制矩阵。
  implementation_anchors:
    build_rank_aware_controls: "descriptors/deconfound.py, DeconfoundAnalyzer.build_rank_aware_controls"
    rank_corr_of_linear_residuals: "descriptors/deconfound.py, DeconfoundAnalyzer.rank_corr_of_linear_residuals"
    analyze_all: "descriptors/deconfound.py, DeconfoundAnalyzer.analyze_all"
    combination_system_rho: "descriptors/combination.py, CombinationValidator._factor_spanning (system_rho)"
    combination_all_rho: "descriptors/combination.py, CombinationValidator._factor_spanning (all_rho)"
  undefined_when:
    insufficient_samples: "有效样本数不足三个，无法计算 Spearman 秩相关；rho 和 p 值均为 NaN。仅在直接调用 rank_corr_of_linear_residuals 时可触发，analyze_all 路径下不可达（skip 分支已在 n_valid < 5 拦截，进入残差化的样本数恒 >= 5）"
    empty_control_space: "控制矩阵列数为零，无混杂变量可控制；残差化无意义，rho 和 p 值均为 NaN"
    controls_rank_deficient: "控制变量列数大于等于样本数，或控制矩阵秩亏，正交投影残差化退化；rho 和 p 值均为 NaN"
    lstsq_numerical_failure: "np.linalg.lstsq 抛出 LinAlgError，数值失败（非秩亏）；rho 和 p 值均为 NaN。与 controls_rank_deficient 区分：后者是结构性退化（秩亏），前者是数值失败（如奇异矩阵的 lstsq 内部报错）"
    not_attempted: "该描述符有效值不足五个，未进入去混杂计算；所有数值列为 NaN，skip_reason 为 insufficient_valid_samples，n_valid 记录实际有效数"
  superseded_definition_used_in: [run01, run02, run03_3a, run03_3b, run03_3c]
  superseded_at_commit: [3c5e921, ddcc5d7]
  not_partial_spearman: >
    本量【不是】文献意义上的 partial Spearman。
    标准做法是先秩变换再偏出，本实现顺序相反——先线性残差化再秩变换。
  monotonic_invariance: >
    本量对 x 的单调变换【不】不变，因线性残差化不保秩。
    对 x 施加 exp/log 等单调非线性变换会改变残差化结果，进而改变 rho。
  decision_date: "2026-08-10"
  decision_precedes_dataset_finalization: true
  definition_revision_date: "2026-08-13"
  revision_date: "2026-08-13"
  revision_reason: >
    原 definition 将残差化基写成 {intercept, system, anion_type} 张成的列空间，
    与实现不符：intercept 由 Ridge fit_intercept 隐式提供而非列；
    anion_type 仅秩增量列进入而非全部。同时补充记录组合层使用两个对照量。
    本次修订将 definition 去除行号（行号会漂移），把文件与函数名移到
    implementation_anchors 字段；新增 superseded_definition_used_in 记录旧表述送审范围。
    W1-1 修订：残差化方式从 Ridge(alpha=1.0) 收缩改为正交投影（OLS 残差，
    alpha=0），消除参考类字母序依赖和组均值收缩偏差。controls_rank_deficient
    条目同步更新为涵盖秩亏检测。
    W1-1 截距修正：给控制矩阵追加全 1 列作为显式截距，修复参考类残差被
    全局均值而非组均值中心化的缺陷。

stability_selection:
  # 子采样 Lasso；填充和缩放在每个子样本 Pipeline 内独立拟合
  method: subsampled_lasso
  selection_alpha: 0.05
  preprocessing:
    - median_imputation
    - standard_scaling
  n_bootstrap: 100
  threshold: 0.6          # 被选中的频率阈值
  fraction: 0.5           # 每次自举采样比例
  random_seed: 42
  cluster_threshold: 0.8  # W5-2 冻结值：|rho| >= 0.8 为同簇（实现本轮不做，键与值现在冻结）

combination:
  # 原始物理值上的受约束枚举；只在完整公式进入模型后做折内标准化
  method: constrained_enumeration
  raw_value_source: feature_df
  max_descriptors: 3
  min_descriptors: 2
  pair_rules:
    source_of_truth: descriptors.combination.PAIR_OPERATOR_RULES
    execution: enforced_by_declarative_registry
    commutative_operators: [add, multiply]
    canonical_unordered_pairs: true
    directional_ratios: explicit_registry_entries_only
    reject_zero_or_nonfinite_denominator: true
    default_ratio_allowed: false
  triple_rules:
    adjacency_source_of_truth: descriptors.combination.PAIR_OPERATOR_RULES
    same_family_source_of_truth: descriptors.combination.SAME_FAMILY_OPERATOR_RULES
    execution: enforced_by_declarative_registry
    enabled: true
    shape: two_from_one_family_plus_one_from_explicit_adjacent_family
    arbitrary_triples: false
  # 禁止的运算符——描述符构造中不允许使用
  forbidden_operators:
    - log          # 禁止对原始描述符取对数（因为目标已是 log）
    - sqrt         # 禁止开方（物理意义不明确）
    - power        # 禁止幂运算（过拟合风险高）
  # 下列语义目前是人工解释审查要求，不是程序化筛选条件。
  manual_physical_interpretation_review:
    enforced_by_search: false
    review_questions:
      - monotonic_with_ion_size
      - positive_correlation_with_vacancy

combination_validation:
  status: exploratory
  causal_claim: false
  evidence_blocks:
    - noise_baseline
    - factor_spanning
    - per_system
    - bootstrap_ci
  bootstrap:
    method: system_stratified
    random_seed: 42
  factor_spanning:
    primary_method: fold_safe_oof_target_residual_prediction
    control_design: rank_aware_system_primary_plus_incremental_anion
    formula_preprocessing: fold_local_median_imputation_and_scaling
    partial_association_role: supplementary_only
  selection_uncertainty:
    nested_outer_group_selection_available: false

evidence:
  per_system:
    min_n: 5
    exact_perm_max_n: 8
    monte_carlo_max_n: 10
    monte_carlo_draws: 10000

evaluation:
  # 主要评价指标
  primary: rank_corr_of_linear_residuals
  # 辅助评价指标
  secondary:
    - stability_score   # 稳定性选择得分
  # 模型
  model:
    # Ridge 回归：84 样本用 RF 容易过拟合，Ridge 正则化更稳健
    name: ridge
    alpha: 1.0          # 记录值；实际来源为 CLI --alpha，本键当前不被代码读取。
                        # 单描述符层已改为正交投影；combination._factor_spanning 折内 Ridge 仍用此值。
    random_seed: 42
    fold_preprocessing:
      - median_imputation
      - standard_scaling
  # 相关性方法
  correlation_method: spearman   # 使用 Spearman 秩相关（非参数，适合小样本）

# 两条轨道只共享这一冻结输入契约；任何运行结果均不共享。
shared_input:
  frozen: true
  raw_file: data/naconductor_raw.csv
  descriptor_registry: descriptors/__init__.py
  registry_revision: structural-registry-v1-2026-08-03
  semantics: >
    Agent 与 pipeline 可以同时启动，并只读取本节指定的原始 CSV 与注册表。
    在 C9 前禁止任一轨道读取、修改或据另一轨道的结果作筛选决定。

tracks:
  pipeline:
    output_dir: results/pipeline
    reads: [shared_input]
    must_not_read: [results/agent]
    status: exploratory

  agent:
    results_file: results/agent/results.tsv
    ideas_file: results/agent/ideas.tsv
    feature_cache_file: results/agent/descriptor_features.csv
    figure_file: results/agent/figures/metric_history.png
    reads: [shared_input]
    must_not_read: [results/pipeline]
    status:
      primary_metric: rank_corr_of_linear_residuals
      max_iterations: 30
      patience: 8
      semantics: >
        仅对 status 为 evaluated、keep 或 discard 的有限线性残差秩相关
        计入耐心；crash 和不可用 CV 策略不会伪造改善或消耗耐心。

c9_cross_track_review:
  user_authorization_required: true
  inputs_must_be_completed_and_frozen: true
  read_only_inputs: [results/agent, results/pipeline]
  interpretation: >
    结果一致仅是独立三角验证或优先复核线索，不构成因果证据；
    两条轨道均不建立因果关系。
